name: Redesign CI

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pan-alpine-product-redesign

concurrency:
  group: redesign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
